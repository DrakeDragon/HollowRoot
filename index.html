}
const PASSF=.45;
function ccomp(f){return f<=3?f:3*(1+Math.log(f/3));}
function creatureStats(S){
 const s=G.s;
 const list=s.cr.active.filter(id=>s.cr.own[id]&&CRMAP[id]);
 const sh={mulRes:{}};RES_ORDER.forEach(r=>sh.mulRes[r]=1);for(const k in MULT_T)sh[k]=1;
 // pass 1: crMul contributions
 list.forEach(id=>{
  const c=CRMAP[id],st=s.cr.own[id],ev=st.evo?1.5:1;
  [c.pass,st.lvl>=5?c.b5:[],st.lvl>=15?c.b15:[],st.lvl>=30?c.b30:[]].forEach((arr,k)=>arr.forEach(e=>{if(e.t==='crMul')applyEff(sh,e,k===0?st.lvl*ev:ev);}));
 });
 S.crRaw=S.crMul*sh.crMul;S.crMul=1+.5*Math.log10(Math.max(1,S.crRaw));
 list.forEach(id=>{
  const c=CRMAP[id],st=s.cr.own[id],ev=(st.evo?1.5:1)*S.crMul;
  c.pass.forEach(e=>{if(e.t!=='crMul')applyEff(sh,e,st.lvl*ev*PASSF);});
  if(st.lvl>=5)c.b5.forEach(e=>{if(e.t!=='crMul')applyEff(sh,e,ev);});
  if(st.lvl>=15)c.b15.forEach(e=>{if(e.t!=='crMul')applyEff(sh,e,ev);});
  if(st.lvl>=30)c.b30.forEach(e=>{if(e.t!=='crMul')applyEff(sh,e,ev);});
 });
 // merge with diminishing returns
 for(const k in sh){
  if(k==='mulRes'){RES_ORDER.forEach(r=>{S.mulRes[r]*=ccomp(sh.mulRes[r]);});continue;}
  if(k==='crMul')continue;
  if(k in MULT_T){const f=sh[k];S[k]*=(f>=1?ccomp(f):1/ccomp(1/f));}
  else S[k]=(S[k]||0)+sh[k];
 }
 // timed skill buffs: gentle compression when many overlap
 const sb={mulRes:{}};RES_ORDER.forEach(r=>sb.mulRes[r]=1);for(const k in MULT_T)sb[k]=1;
 list.forEach(id=>{if(s.buffs['cs_'+id]>Date.now())CRMAP[id].sk.eff.forEach(e=>applyEff(sb,e,1));});
 const bc=f=>f<=8?f:8*(1+Math.log(f/8)*.6);
 for(const k in sb){
  if(k==='mulRes'){RES_ORDER.forEach(r=>{S.mulRes[r]*=bc(sb.mulRes[r]);});continue;}
  if(k in MULT_T){const f=sb[k];S[k]*=(f>=1?bc(f):1/bc(1/f));}
  else S[k]=(S[k]||0)+sb[k];
 }
}
// ---- bounties ----
function bCur(b){
 const s=G.s;
 switch(b.k){
  case 'tap':return s.st.taps;case 'prod':return s.life[b.res];case 'raid':return s.st.raids;
  case 'bld':return s.st.builds;case 'exp':return s.st.exps;case 'spell':return s.st.spells;
  case 'feed':return s.st.feeds;case 'conq':return s.st.conq;
 }
 return 0;
}
function bProg(b){return Math.min(b.goal,bCur(b)-b.snap);}
function bDesc(b){
 switch(b.k){
  case 'tap':return 'Tap '+fmt(b.goal)+' times';
  case 'prod':return 'Produce '+fmt(b.goal)+' '+RES[b.res].i+' '+RES[b.res].n;
  case 'raid':return 'Repel '+b.goal+' raid'+(b.goal>1?'s':'');
  case 'bld':return 'Construct '+b.goal+' buildings';
  case 'exp':return 'Finish '+b.goal+' expedition'+(b.goal>1?'s':'');
  case 'spell':return 'Cast '+b.goal+' spells or skills';
  case 'feed':return 'Raise creature bonds '+b.goal+' time'+(b.goal>1?'s':'');
  case 'conq':return 'Conquer '+b.goal+' region'+(b.goal>1?'s':'');
 }
 return '';
}
function genBounty(){
 const s=G.s,e=s.era,pool=['tap','prod','prod','bld'];
 if(e>=1){pool.push('raid','exp','conq');}
 if(e>=2)pool.push('spell');
 if(crCount()>0)pool.push('feed','feed');
 const used=s.bounty.list.map(b=>b.k);
 let k=pool[Math.floor(Math.random()*pool.length)];
 for(let i=0;i<6&&used.indexOf(k)>=0&&k!=='prod';i++)k=pool[Math.floor(Math.random()*pool.length)];
 const b={k,snap:0,goal:1,rew:{secs:60+e*12,xp:.02+.004*e,enc:.2}};
 if(k==='tap')b.goal=60+e*50;
 else if(k==='prod'){const rs=unlockedRes().filter(r=>r!=='crystal');b.res=rs[Math.floor(Math.random()*rs.length)];b.goal=Math.ceil(Math.max(200,G.rates[b.res]*900));}
 else if(k==='raid')b.goal=1+Math.floor(e/3);
 else if(k==='bld')b.goal=4+e*3;
 else if(k==='exp')b.goal=1+(e>=4?1:0);
 else if(k==='spell')b.goal=2+(e>=5?2:0);
 else if(k==='feed')b.goal=2+Math.floor(e/2);
 else if(k==='conq')b.goal=1;
 b.snap=bCur(b);
 return b;
}
function fillBounties(){
 const s=G.s,now=Date.now();
 while(s.bounty.list.length<3&&now>=s.bounty.next){s.bounty.list.push(genBounty());}
}
function claimBounty(i){
 const s=G.s,b=s.bounty.list[i];if(!b||bProg(b)<b.goal)return false;
 const mul=Math.pow(1.5,ascLvl('bounty2'));
 RES_ORDER.forEach(r=>{if(RES[r].era<=s.era&&r!=='crystal')addRes(r,Math.max(20,G.rates[r]*b.rew.secs*mul));});
 addXp(xpReward(b.rew.xp*mul));
 s.bounty.list.splice(i,1);s.bounty.next=Date.now()+120000;s.bounty.done++;
 let extra='';
 if(Math.random()<b.rew.enc&&spawnEncounter())extra=' A stranger followed the contract-bearer home.';
 sys('Bounty complete: <b>'+bDesc(b)+'</b>. Rewards claimed.'+extra);toast('📜 Bounty complete');
 emit('struct');return true;
}

function slowChecks(now){

const HEXR=34;
function hexPts(cx,cy){let p=[];for(let i=0;i<6;i++){const a=Math.PI/3*i;p.push((cx+HEXR*Math.cos(a)).toFixed(1)+','+(cy+HEXR*Math.sin(a)).toFixed(1));}return p.join(' ');}
function hexPos(i){const col=i%5,row=Math.floor(i/5);return [HEXR+4+col*1.5*HEXR,HEXR*.87+4+row*1.732*HEXR+(col%2?.866*HEXR:0)];}

// ---------- actions ----------
function handle(a,p,n){
 const s=G.s;
 switch(a){
  case 'focus':s.focus=p;break;
  case 'era':advanceEra();break;
  case 'spell':castSpell(p);break;
  case 'mult':ui.mult=(p==='max'?'max':+p);break;
  case 'buy':{const b=BMAP[p];buyBuilding(p,nBuy(b));break;}
  case 'work':{if(n==='max')setWorkers(p,Math.max(0,idleWorkers()));else setWorkers(p,+n);break;}
  case 'balance':balanceWorkers();break;
  case 'clearw':clearWorkers();break;
  case 'wonder':buildWonder(p);break;
  case 'sub':ui.sub[p]=n;ui.need=true;break;
  case 'attr':addAttr(p,+n);break;
  case 'skill':learnSkill(p);break;
  case 'class':chooseClass(p);break;
  case 'respec':if(!respec())showToast('Need '+fmt(respecCost()[0][1])+' gold');break;
  case 'gear':upgradeGear(p);break;
  case 'comp':compLevelUp(p);break;
  case 'train':{const u=UMAP[p];const m=ui.mult;trainUnit(p,m==='max'?Math.max(1,uMaxN(u)):m);break;}
  case 'sel':ui.sel=p;ui.need=true;break;
  case 'conquer':conquer(p);break;
  case 'exp':startExp(p);break;
  case 'tech':startTech(p);break;
  case 'edict':toggleEdict(p);break;
  case 'shop':buyShop(p);break;
  case 'rebirth':
   if(!canRebirth())break;
   showModal('<h3 style="color:var(--gold);margin-top:0">Rebirth?</h3><div class="sm">Gain <b class="gd">'+fmt(heartGain())+' Heartwood</b>. Buildings, research, army and map reset. Hero, party, relics, trophies and Heartwood stay.</div><button class="btn gold" data-reb="1">Rebirth now</button><button class="btn" data-close="1">Cancel</button>');
   break;
  case 'rename':{const v=($('#nameIn').value||'Warden').trim().slice(0,20)||'Warden';s.name=v;showToast('Name saved');break;}
  case 'notation':s.set.notation=s.set.notation==='sci'?'short':'sci';break;
  case 'vibe':s.set.vibe=!s.set.vibe;break;
  case 'anim':s.set.anim=!s.set.anim;break;
  case 'save':save();showToast('Saved');break;
  case 'export':$('#saveBox').value=exportSave();break;
  case 'import':try{importSave($('#saveBox').value);showToast('Imported');}catch(e){showToast('Invalid save text');}break;
  default:handleExtra(a,p,n);break;
  case 'reset':showModal('<h3 style="color:var(--red);margin-top:0">Delete everything?</h3><div class="sm">This cannot be undone.</div><button class="btn dng" data-hard="1">Yes, delete my save</button><button class="btn" data-close="1">Cancel</button>');break;
 }
 G.dirty=true;
}
function wireEvents(){
 const view=$('#view');
 view.addEventListener('pointerdown',e=>{
  const t=e.target.closest('#tapBtn');
  if(t){
   e.preventDefault();
   t.classList.add('p');setTimeout(()=>t.classList.remove('p'),80);
   const r=tap();tapFx(e.clientX,e.clientY,'+'+fmt(r.v),r.crit);
   if(G.s.set.vibe&&navigator.vibrate)navigator.vibrate(r.crit?25:8);
  }
 });
 view.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  handle(el.dataset.a,el.dataset.p,el.dataset.n);
  uiFrame();
 });
 $('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){setTab(b.dataset.tab);uiFrame();}});
 $('#modal').addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.ev!==undefined&&G.pendingEvent){const c=G.pendingEvent.ch[+t.dataset.ev];if(c.f)resolveEvent(c.f);else{G.pendingEvent=null;}closeModal();uiFrame();}
  else if(t.dataset.close)closeModal();
  else if(t.dataset.reb){closeModal();rebirth();ui.need=true;uiFrame();}
  else if(t.dataset.hard){closeModal();hardReset();ui.need=true;uiFrame();}
  else if(t.dataset.asc){closeModal();ascend();ui.need=true;uiFrame();}
  else if(t.dataset.tale){const q=t.dataset.tale.split('|');chooseTale(q[0],+q[1]);closeModal();ui.need=true;uiFrame();}
 });
}

function shade(hex,amt){
 const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
 r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
 return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

// ---- effects ----
function tapFx(x,y,txt,crit){
 if(!G.s.set.anim)return;
 const f=document.createElement('div');f.className='fl'+(crit?' crit':'');f.textContent=txt;f.style.left=(x-20+Math.random()*30)+'px';f.style.top=(y-30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),900);
 const ic=[RES[G.s.focus].i,'✨','🍃'];
 const n=crit?10:5;
 for(let i=0;i<n;i++){
  const p=document.createElement('div');p.className='pt';p.textContent=ic[i%3];
  const a=Math.random()*6.283,d=30+Math.random()*(crit?90:55);
  p.style.cssText='left:'+x+'px;top:'+y+'px;--dx:'+(Math.cos(a)*d).toFixed(0)+'px;--dy:'+(Math.sin(a)*d-20).toFixed(0)+'px;font-size:'+(11+Math.random()*9).toFixed(0)+'px';
  document.body.appendChild(p);setTimeout(()=>p.remove(),800);
 }
 const r=document.createElement('div');r.className='rip'+(crit?' crit':'');r.style.left=x+'px';r.style.top=y+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);
}
function eraCinematic(e){
 if(!G.s.set.anim)return;
 const o=document.createElement('div');o.className='cine';
 o.innerHTML='<div class="cbox"><div class="c0">A new age dawns</div><div class="c1">'+ERAS[e].n+'</div><div class="c2">'+ERAS[e].tag+'</div></div>';
 document.body.appendChild(o);setTimeout(()=>o.classList.add('out'),2300);setTimeout(()=>o.remove(),2900);
}
function levelFx(l){
 if(!G.s.set.anim)return;
 const o=document.createElement('div');o.className='lvlfx';o.innerHTML='<div>LEVEL '+l+'</div>';
 document.body.appendChild(o);setTimeout(()=>o.remove(),1800);
}
const _advEra=advanceEra;
advanceEra=function(){const e0=G.s.era;const r=_advEra.apply(this,arguments);if(r&&G.s.era>e0){ui.need=true;eraCinematic(G.s.era);}return r;};
const _addXp=addXp;
addXp=function(x){const l0=G.s.hero.lvl;_addXp(x);if(G.s.hero.lvl>l0)levelFx(G.s.hero.lvl);};

 setInterval(()=>{if(G.s)document.body.classList.toggle('noanim',!G.s.set.anim);document.body.dataset.era=G.s?G.s.era:0;},1000);
