<title>Hollowroot: Rise of the Elven Realm</title>
<style>:root{--bg:#07100c;--bg2:#0e1c15;--pn:#172b21;--pn2:#21402f;--ln:#2f5a44;--tx:#eaf3ec;--mt:#92ad9f;--gold:#f0c85a;--grn:#6fd18f;--red:#e86d6d;--blu:#6aaee0;--pur:#a98be6;--disp:"Cinzel","Trajan Pro","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:radial-gradient(120% 60% at 50% -10%,#1b3a2a 0%,transparent 60%),radial-gradient(90% 50% at 100% 100%,#1a2a44 0%,transparent 55%),radial-gradient(80% 40% at 0% 70%,#2a1f3a55 0%,transparent 60%),var(--bg);background-attachment:fixed}
body[data-era="0"]{--gold:#e0b45a}
body[data-era="6"],body[data-era="7"]{--grn:#7af0b8}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:78px}
#top{position:sticky;top:0;z-index:20;background:background:linear-gradient(#08130e,#08130ecc);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #2f5a4466;padding:6px 6px 4px;box-shadow:0 6px 20px #0008}
#res{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#res::-webkit-scrollbar{display:none}
.chip{--a:#9ad;flex:0 0 auto;background:linear-gradient(180deg,#1d3529,#122119);border:1px solid #2f5a44;border-bottom:2px solid var(--a);border-radius:12px;padding:3px 9px 4px;min-width:82px;text-align:center;box-shadow:inset 0 1px 0 #ffffff10,0 2px 8px #0006}
.chip[data-r=wood]{--a:#c98f55}.chip[data-r=stone]{--a:#9aa6b4}.chip[data-r=food]{--a:#7fcf6a}.chip[data-r=iron]{--a:#8fb0c8}.chip[data-r=gold]{--a:#f0c85a}.chip[data-r=mana]{--a:#a98be6}.chip[data-r=crystal]{--a:#6ee8f0}
.chip b{display:block;font-size:14px;letter-spacing:.2px;text-shadow:0 0 10px color-mix(in srgb,var(--a) 50%,transparent)}
.chip small{color:var(--mt);font-size:11px}
#sub{display:flex;justify-content:space-between;font-size:12px;color:var(--mt);padding:4px 4px 0}
#sub span:last-child{font-family:var(--disp);color:var(--gold);letter-spacing:.5px}
#view{padding:10px 10px 20px;flex:1;animation:fadeUp .3s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:background:linear-gradient(#0a150ff2,#050b08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #2f5a44aa;display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 24px #000a}
#nav::-webkit-scrollbar{display:none}
#nav button{position:relative;flex:0 0 auto;min-width:64px;background:none;border:0;color:var(--mt);padding:8px 4px 6px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;transition:color .2s}
#nav button i{font-style:normal;font-size:21px;transition:transform .2s,filter .2s;filter:grayscale(.5) brightness(.85)}
#nav button.on{color:var(--gold);background:linear-gradient(#f0c85a14,transparent)}
#nav button.on i{transform:translateY(-2px) scale(1.18);filter:drop-shadow(0 0 8px #f0c85a99)}
#nav button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 10px var(--gold)}
#nav button.dot::after{content:"";width:8px;height:8px;background:radial-gradient(#ff9a9a,#e03c3c);border-radius:50%;position:absolute;top:6px;right:16px;box-shadow:0 0 8px #f55;animation:pu 1.2s infinite}
h2{font-family:var(--disp);font-size:16px;letter-spacing:.8px;margin:16px 0 8px;background:linear-gradient(180deg,#fff0b8,#e0a93a);-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#e0a93a88,transparent)}
h3{font-family:var(--disp);font-size:14px;margin:10px 0 4px;color:var(--grn);letter-spacing:.5px}
.card{position:relative;background:linear-gradient(180deg,#1d3529,#14261d);border:1px solid #2f5a44;border-radius:14px;padding:11px;margin-bottom:9px;box-shadow:inset 0 1px 0 #ffffff12,0 6px 16px #0006}
.card::before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;background:linear-gradient(135deg,#ffffff0c,transparent 40%)}
.card.sm{padding:8px 10px}
.hero-card{border-color:#6b5a1f;background:linear-gradient(180deg,#2a2a18,#17201a)}
.row{display:flex;align-items:center;gap:9px}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.mt{color:var(--mt)}.sm{font-size:12px}.xs{font-size:11px}
.ok{color:var(--grn)}.bad{color:var(--red)}.gd{color:var(--gold)}
.btn{background:linear-gradient(180deg,#2b4f3b,#1b3427);border:1px solid #3c6e53;color:var(--tx);border-radius:11px;padding:8px 12px;font-size:14px;cursor:pointer;font-weight:700;box-shadow:inset 0 1px 0 #ffffff1c,0 3px 0 #0a1710,0 5px 10px #0006;transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #ffffff1c,0 1px 0 #0a1710}
.btn.pri{background:linear-gradient(180deg,#3fa66a,#23703f);border-color:#6ee09a;text-shadow:0 1px 2px #0008}
.btn.gold{background:linear-gradient(180deg,#e8b84a,#a8741a);border-color:#ffe08a;color:#2a1c04;text-shadow:0 1px 0 #ffffff55;box-shadow:inset 0 1px 0 #fff8,0 3px 0 #5a3c0a,0 5px 14px #e8b84a44}
.btn.dng{background:linear-gradient(180deg,#b84a4a,#7a2424);border-color:#f08a8a}
.btn.dis{opacity:.38;filter:saturate(.4)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.btn.on{border-color:var(--gold);color:var(--gold);background:linear-gradient(180deg,#4a4018,#2a2610);box-shadow:inset 0 0 12px #f0c85a44,0 3px 0 #0a1710}
.spellb{background:linear-gradient(180deg,#2b2a5a,#17183a);border-color:#6a5ad8}
.bar{height:10px;background:#050c08;border:1px solid #2f5a44;border-radius:7px;overflow:hidden;box-shadow:inset 0 2px 4px #000a}
.bar>i{position:relative;display:block;height:100%;background:linear-gradient(90deg,#2f8a52,#7be39b);width:0;border-radius:6px;transition:width .3s}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 30%,#ffffff55 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.6s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.bar.g>i{background:linear-gradient(90deg,#9a6a10,#ffe08a)}
.bar.r>i{background:linear-gradient(90deg,#8a2a2a,#f08a8a)}
.ico{display:flex;align-items:center;justify-content:center;font-size:25px;width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3c6a52,#142a1f 75%);border:1px solid #4a7a60;box-shadow:inset 0 0 10px #0008,0 2px 8px #0007}

.orb{--rc:#9fb0a6;position:relative;flex:0 0 52px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:27px;background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--rc) 40%,#1a2d24),#0b1611 78%);border:2px solid var(--rc);box-shadow:0 0 14px color-mix(in srgb,var(--rc) 45%,transparent),inset 0 0 12px #000a}
.orb span{display:block;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 3px 3px #000a)}
.orb.r0{--rc:#9fb0a6}.orb.r1{--rc:#6cc788}.orb.r2{--rc:#6aaee0}.orb.r3{--rc:#a98be6}.orb.r4{--rc:#f0c85a}.orb.r5{--rc:#ff7a9a}
.orb.r3::before,.orb.r4::before,.orb.r5::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,transparent,var(--rc),transparent 40%,var(--rc),transparent 80%);-webkit-mask:radial-gradient(circle,transparent 61%,#000 63%);mask:radial-gradient(circle,transparent 61%,#000 63%);animation:spin 5s linear infinite;opacity:.85}
.orb.r4,.orb.r5{animation:glowp 2.4s ease-in-out infinite}

@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glowp{50%{box-shadow:0 0 26px color-mix(in srgb,var(--rc) 80%,transparent),inset 0 0 12px #000a}}
.partyc{margin:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px}
.heroP{flex:0 0 66px;width:66px;height:80px}.heroP svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px #000a);animation:bob 3.4s ease-in-out infinite}
.tabs{display:flex;gap:6px;margin-bottom:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
.tabs .btn{flex:0 0 auto}
/* realm scene */
#tapwrap{display:flex;flex-direction:column;align-items:stretch;margin:0 0 8px;position:relative}
#tapBtn,.sceneBtn{position:relative;width:100%;aspect-ratio:360/250;border-radius:18px;overflow:hidden;cursor:pointer;touch-action:none;border:2px solid #4a6b57;box-shadow:0 0 0 1px #000,0 10px 30px #000b,inset 0 0 40px #0008;background:#0b1611}
.scene{position:absolute;inset:0;width:100%;height:100%}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 40%,transparent 55%,#000a 100%)}
.treeg{transform-origin:180px 170px;transition:transform .12s}
#tapBtn.p .treeg{transform:scale(1.035,.985)}
#tapBtn.p{box-shadow:0 0 0 1px #000,0 10px 30px #000b,inset 0 0 40px #0008,0 0 24px #7be39b55}
.aura{animation:aura 4s ease-in-out infinite;transform-origin:180px 100px}
@keyframes aura{50%{transform:scale(1.08);opacity:.8}}
.ringp{transform-origin:180px 92px;animation:ringp 5s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes ringp{50%{transform:scale(1.05);opacity:.15}}
.cl{animation:cdrift 70s linear infinite}.cl.c2{animation-duration:95s;animation-delay:-40s}
@keyframes cdrift{from{transform:translateX(-120px)}to{transform:translateX(420px)}}
.twk{animation:twk 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes twk{50%{opacity:.25}}
.win{animation:twk 4s ease-in-out infinite}
.ff{animation:ff var(--t,5s) ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes ff{0%,100%{transform:translate(0,0);opacity:.1}25%{transform:translate(8px,-10px);opacity:1}50%{transform:translate(-6px,-18px);opacity:.3}75%{transform:translate(10px,-8px);opacity:1}}
.smoke{animation:smoke 3.4s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes smoke{from{transform:translate(0,0) scale(.6);opacity:.5}to{transform:translate(6px,-22px) scale(2.4);opacity:0}}
.sunwrap{animation:sunmove var(--dur,360s) linear infinite;animation-delay:calc(var(--ph,0) * var(--dur,360s) * -1)}
.moonwrap{animation:moonmove var(--dur,360s) linear infinite;animation-delay:calc(var(--ph,0) * var(--dur,360s) * -1)}
@keyframes sunmove{0%{transform:translate(-30px,175px)}29%{transform:translate(180px,34px)}58%{transform:translate(390px,175px)}100%{transform:translate(390px,175px)}}
@keyframes moonmove{0%{transform:translate(-30px,175px)}58%{transform:translate(-30px,175px)}79%{transform:translate(200px,36px)}100%{transform:translate(390px,175px)}}
.nightov{animation:nightov var(--dur,360s) linear infinite;animation-delay:calc(var(--ph,0) * var(--dur,360s) * -1)}
@keyframes nightov{0%,52%{opacity:0}62%,90%{opacity:.5}100%{opacity:0}}
.stars{animation:starsf var(--dur,360s) linear infinite;animation-delay:calc(var(--ph,0) * var(--dur,360s) * -1)}
@keyframes starsf{0%,54%{opacity:0}64%,90%{opacity:1}100%{opacity:0}}
.ffs{animation:ffsf var(--dur,360s) linear infinite;animation-delay:calc(var(--ph,0) * var(--dur,360s) * -1)}
@keyframes ffsf{0%,45%{opacity:.25}60%,92%{opacity:1}100%{opacity:.25}}
.actors,.fallwrap{position:absolute;inset:0;pointer-events:none}
.actor{position:absolute;left:0;animation:walk var(--dur,24s) linear infinite}
.actor i{display:block;font-style:normal;animation:hop .7s ease-in-out infinite;filter:drop-shadow(0 3px 2px #0009)}
@keyframes walk{0%{left:3%;transform:scaleX(1)}49.9%{left:90%;transform:scaleX(1)}50%{left:90%;transform:scaleX(-1)}99.9%{left:3%;transform:scaleX(-1)}100%{left:3%;transform:scaleX(1)}}
@keyframes hop{50%{transform:translateY(-4px)}}
.fall{position:absolute;top:-10%;animation:fall linear infinite;opacity:.85}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(20px,120px) rotate(160deg)}100%{transform:translate(-10px,260px) rotate(340deg);opacity:.2}}
.eraBanner{position:absolute;left:0;right:0;top:0;padding:10px 14px 24px;background:linear-gradient(#000c,transparent);pointer-events:none}
.eb1{font-family:var(--disp);font-size:19px;letter-spacing:1.2px;color:#ffe9a8;text-shadow:0 2px 6px #000,0 0 14px #f0c85a66}
.eb2{font-size:11px;color:#dfeee4;opacity:.85;text-shadow:0 1px 3px #000}
.sceneHint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#fff;opacity:.55;pointer-events:none;animation:pu 2.4s infinite;text-shadow:0 1px 4px #000}
.tapinfo{margin-top:8px;text-align:center;font-size:15px}
.focus{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0 10px}
.focus .btn{padding:5px 10px;font-size:13px}
.fl{position:fixed;pointer-events:none;font-weight:800;font-family:var(--disp);color:#ffe9a8;text-shadow:0 2px 4px #000,0 0 10px #f0c85a;animation:fl .9s ease-out forwards;z-index:50;font-size:19px}
.fl.crit{color:#ffb070;font-size:27px;text-shadow:0 2px 4px #000,0 0 16px #ff7a2a}
@keyframes fl{to{transform:translateY(-76px) scale(1.1);opacity:0}}
.pt{position:fixed;pointer-events:none;z-index:49;transform:translate(-50%,-50%);animation:pt .75s ease-out forwards}
@keyframes pt{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4) rotate(180deg);opacity:0}}
.rip{position:fixed;pointer-events:none;z-index:48;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid #9affcf;animation:rip .55s ease-out forwards}
.rip.crit{border-color:#ffb070;border-width:3px}
@keyframes rip{to{transform:scale(7);opacity:0}}
.cine{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#2a2260ee,#050510f5);animation:cin .5s both;pointer-events:none}
.cine.out{animation:cout .6s forwards}
.cbox{text-align:center;padding:20px}
.cbox .c0{font-size:12px;letter-spacing:5px;text-transform:uppercase;color:#bfb3ff;animation:cin .8s .2s both}
.cbox .c1{font-family:var(--disp);font-size:40px;line-height:1.1;margin:8px 0;background:linear-gradient(180deg,#fff6c8,#e0a93a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #f0c85a88);animation:zoomin 1s .3s both}

@keyframes cin{from{opacity:0}}@keyframes cout{to{opacity:0}}
@keyframes zoomin{from{opacity:0;transform:scale(.6);letter-spacing:12px}}
.lvlfx{position:fixed;left:0;right:0;top:30%;z-index:70;text-align:center;pointer-events:none;animation:lvl 1.8s ease-out forwards}
.lvlfx div{display:inline-block;font-family:var(--disp);font-size:34px;letter-spacing:4px;color:#fff3b8;text-shadow:0 0 20px #f0c85a,0 0 40px #ff9a2a,0 3px 4px #000}
@keyframes lvl{0%{opacity:0;transform:translateY(30px) scale(.7)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.log{max-height:220px;overflow-y:auto;font-size:13px}
.log div{padding:4px 0;border-bottom:1px solid #1d352966}
.log .story{color:#e0efb0}
.log .sys b{color:var(--gold)}

@keyframes ti{from{transform:translateY(-16px) scale(.8);opacity:0}}
@keyframes to{to{opacity:0}}
#modal{position:fixed;inset:0;z-index:80;background:#000a;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
#modal .box{background:linear-gradient(180deg,#223d2f,#12231a);border:1px solid var(--gold);border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 0 0 3px #00000088,0 0 0 4px #f0c85a44,0 20px 60px #000,0 0 40px #f0c85a22;animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(14px)}}
#modal .box .btn{display:block;width:100%;margin-top:9px}
#modal h3{font-family:var(--disp);font-size:19px}
.badge{display:inline-block;background:#050c08;border:1px solid #3a6a52;border-radius:9px;padding:1px 8px;font-size:11px;color:#c8dccf}
.pulse{animation:pu 1.4s infinite}
@keyframes pu{50%{opacity:.55}}

.tag{font-size:10.5px;background:#050c08;border-radius:7px;padding:1px 7px;margin-left:5px;color:var(--gold);border:1px solid #ffffff14}

<script>

// ===== Hollowroot data part 1: resources, eras, buildings =====
const RES_ORDER=['wood','stone','food','iron','gold','mana','crystal'];
const RES={
 wood:{n:'Wood',i:'🪵',v:1,era:0},
 stone:{n:'Stone',i:'🪨',v:1.3,era:0},
 food:{n:'Food',i:'🌾',v:1,era:0},
 iron:{n:'Iron',i:'⛓️',v:2.5,era:1},
 gold:{n:'Gold',i:'🪙',v:4,era:1},
 mana:{n:'Mana',i:'✨',v:6,era:2},
 crystal:{n:'Crystal',i:'💎',v:40,era:5}
};
const EB=[0,500,6e4,5e7,2e11,4e14,5e17,3e21];

function effText(e){
 const pc=v=>'+'+Math.round((v-1)*100)+'%';
 const nm=e.res?(Array.isArray(e.res)?e.res:[e.res]).map(r=>RES[r]?RES[r].n:r).join('/'):'';
 switch(e.t){
  case 'mulAll':return pc(e.v)+' all production';
  case 'mulRes':return 'x'+(Math.round(e.v*100)/100)+' '+nm;
  case 'mulWork':return pc(e.v)+' worker output';
  case 'click':return 'x'+(Math.round(e.v*100)/100)+' tap power';
  case 'clickPct':return '+'+Math.round(e.v*100)+'% tap scaling';
  case 'popMul':return pc(e.v)+' population';
  case 'popGrow':return 'x'+e.v+' pop growth';
  case 'costRed':return '-'+Math.round(e.v*1000)/10+'% building costs';
  case 'unitCost':return '-'+Math.round(e.v*100)+'% unit costs';
  case 'armyMul':return pc(e.v)+' army power';
  case 'xp':return pc(e.v)+' hero XP';
  case 'rSpeed':return pc(e.v)+' research speed';
  case 'spellCd':return pc(e.v).replace('+','')+' spell cooldowns';
  case 'spellCost':return pc(e.v).replace('+','')+' spell cost';
  case 'spellDur':return pc(e.v)+' spell duration';
  case 'raidDef':return pc(e.v)+' raid defense';
  case 'raidLoot':return pc(e.v)+' raid loot';
  case 'bond':return pc(e.v)+' bond gain';
  case 'crit':return '+'+Math.round(e.v*100)+'% crit chance';
  case 'critMul':return 'x'+e.v+' crit damage';
  case 'offCap':return '+'+e.v+'h offline cap';
  case 'offEff':return '+'+Math.round(e.v*100)+'% offline efficiency';
  case 'edictSlots':return '+'+e.v+' edict slot';
  case 'expSlots':return '+'+e.v+' expedition slot';
  case 'resSlots':return '+'+e.v+' research slot';
  case 'expSpeed':return pc(e.v)+' expedition speed';
  case 'gain':return pc(e.v)+' Heartwood gain';
  case 'crMul':return pc(e.v)+' creature boons';
  case 'crSlots':return '+'+e.v+' creature slot';
  case 'crLuck':return '+'+Math.round(e.v*100)+'% creature encounter luck';
  case 'crBond':return pc(e.v)+' creature bonding speed';
  case 'seed':return pc(e.v)+' Worldseed power';
 }
 return e.t;
}

  'It found a sealed vault of old elven coins. It returned them with a shrug and a very dusty bow.',
  'The tunnels link every district. The badger is quietly the most important engineer in the realm. Orrin refuses to speak to it.']});
CR({id:'newt',n:'Lantern Newt',i:'🦎',rar:1,era:2,hab:'Whispering fen',fav:'mana',

  'The Lantern Newt lights the way for the night scribes. Some say it also reads over their shoulders.',
  'Its glow now changes color with your mood. The council has requested it stop doing that.',
  'It climbs the Moonwell and the whole well hums back. The Newt is a lantern for something much older than a lantern.']});
CR({id:'owl',n:'Hollow Owl',i:'🦉',rar:2,era:2,hab:'Hollowroot knot',fav:'mana',

  'The Hollow Owl has opinions on your research order. They are correct. This is irritating.',
  'It teaches your scribes a method of writing that makes the page glow when it is true. Sadly, much of what they wrote glows weakly.',
  'The owl speaks the true name of the Hollowroot into the dark. Something far underground answers. Gently.']});
// ---- Era 3 ----
CR({id:'stag',n:'Thornback Stag',i:'🦌',rar:1,era:3,hab:'Briar forest',fav:'food',

  'Its antlers bloom in spring and the whole district smells of rain. The city council has asked if it could do that year-round.',
  'It lowers its head to you, once. Its antlers are heavy with living flowers. You have never been so honored.']});
CR({id:'wolf',n:'Silverpaw Wolf',i:'🐺',rar:1,era:3,hab:'Moonlit ridge',fav:'food',
 pass:[ea('armyMul',1.012)],b5:[ea('raidDef',1.1)],b15:[ea('armyMul',1.3)],b30:[ea('raidLoot',1.4)],

  'Silverpaw lets nobody sleep on watch. It does not bark. It simply stares, and the guards become ashamed.',
  'The wolf leads a night patrol into the fen. They return with nine bandits, one stolen cow, and a very satisfied wolf.',
  'Its howl at the full moon echoes across five regions. Orc scouts turn back without being told.']});
CR({id:'pike',n:'Glassfin Pike',i:'🐟',rar:1,era:3,hab:'Brightwater ford',fav:'gold',
 pass:[mr('gold',1.02)],b5:[ea('crit',.03)],b15:[mr('gold',1.4)],b30:[ea('mulAll',1.1)],

  'The Glassfin Pike can see through lies. The council has quietly stopped holding meetings near the fountain.',
  'It teaches a child to read the surface of water. The child becomes the best negotiator the town has ever produced.',
  'The pike glows gold at dusk. Every merchant in the district claims it is "their" lucky charm. It belongs to nobody. It likes that.']});
CR({id:'bear',n:'Bellows Bear',i:'🐻',rar:2,era:3,hab:'Foundry caves',fav:'iron',
 pass:[ea('raidDef',1.015)],b5:[mr('iron',1.2)],b15:[ea('raidDef',1.4)],b30:[ea('armyMul',1.3)],

  'The Bellows Bear has taken the night shift. Nobody remembers hiring it. Nobody complains.',
  'It fights off a troll that tried to steal a barrel of ore. The troll apologizes the next morning, with flowers.',
  'It sits at the forge like a slumbering mountain. A hundred hammers work around it, and the bear hums.']});
CR({id:'wisp',n:'Marsh Wisp',i:'✨',rar:2,era:3,hab:'Silent marsh',fav:'mana',
 pass:[mr('mana',1.025)],b5:[ea('spellDur',1.1)],b15:[mr('mana',1.5)],b30:[ea('spellCd',.9)],

 lore:['A drifting light leads you through a marsh at night. You\'re not sure when you started following it, but you\'re glad you did.',
  'The Marsh Wisp has learned to hold still on request. This took sixteen weeks. It is very proud.',
  'It hovers beside Mira\'s cauldron and the potions come out in colors that no one has seen.',
  'You realize the wisp has been leading you somewhere for months. At last it stops, above a quiet pool, and shows you a star reflected.']});
CR({id:'spider',n:'Loom Spider',i:'🕷️',rar:2,era:3,hab:'Silkwood canopy',fav:'wood',
 pass:[ea('rSpeed',1.015)],b5:[ea('costRed',.01)],b15:[ea('rSpeed',1.3)],b30:[ea('crSlots',1)],

 lore:['A spider the size of a cart weaves a web across a stalled bridge. By morning, the bridge is stronger than stone. The spider is meticulously polite about it.',
  'The Loom Spider reads the web it makes. Last night it told the baker that her mother\'s recipe was "fine, but the sugar is wrong." The baker wept.',
  'It weaves tapestries that predict small things. A rainstorm. A sneeze. A tax audit.',
  'The Spider finishes a tapestry of the whole realm and leaves one thread unspun. The thread, it says, is yours.']});


// ===== part 5b: creature species 16-40 =====
// ---- Era 4 ----
CR({id:'ram',n:'Cragclimber Ram',i:'🐏',rar:1,era:4,hab:'Skyreach crags',fav:'stone',

  'It never falls. It never slips. The workers have begun asking it for life advice, which it refuses with the dignity of a mountain.',
  'The ram stands on the highest crag at dawn, silhouetted. Some call it a god. It would eat a cabbage if you offered.']});
CR({id:'crow',n:'Stormcrow',i:'🐦‍⬛',rar:2,era:4,hab:'Thunder cliffs',fav:'mana',

  'The Stormcrow brings gossip from five regions. It has a taste for scandal.',
  'It knows the weather three days before it happens, and says nothing, because it enjoys watching you get wet.',
  'It circles the realm each dawn and returns with a feather for every border still safe. Today, there are all of them.']});
CR({id:'peacock',n:'Gilded Peacock',i:'🦚',rar:2,era:4,hab:'Embassy gardens',fav:'gold',

  'Foreign dignitaries now bring it gifts. They also bring you gifts, sometimes.',
  'Its feathers are rumored to be worth more than a city. It lets you keep them. This is called friendship.']});
CR({id:'salamander',n:'Ashen Salamander',i:'🔥',rar:2,era:4,hab:'Ember vents',fav:'iron',

  'The Ashen Salamander is warm. Pleasantly, aggressively warm. Winter is cancelled in your barracks.',
  'It heats a sword to the exact temperature of a good decision.',
  'The Salamander glows white-hot and the forge never cools again. The smiths pretend this was their idea.']});
CR({id:'wyrm',n:'Mirewyrm',i:'🐍',rar:2,era:4,hab:'Whispering fen',fav:'iron',g:{k:'reg',i:8},

  'The Mirewyrm hisses at tax collectors. Tax collectors have noticed and taken a different route.',
  'It remembers the first elven kings. It remembers them being worse at fishing.',
  'It coils around the whole fen, a living wall. Nothing crosses it that it has not decided to let in.']});
CR({id:'shadecat',n:'Shade Cat',i:'🐈‍⬛',rar:3,era:4,hab:'Midnight alleys',fav:'gold',

  'It disappears for two days and returns with an enemy\'s battle plans. And a mouse. The mouse is for you.',
  'The cat sleeps in your lap while the world burns outside the window. This is the highest honor a cat can bestow.']});
// ---- Era 5 ----
CR({id:'griffin',n:'Skyreach Griffin',i:'🦅',rar:3,era:5,hab:'Skyreach crags',fav:'food',g:{k:'reg',i:10},

  'It carries scouts over mountains in an afternoon. The scouts get a stern look when they ask for a second flight.',

CR({id:'unicorn',n:'Glasswood Unicorn',i:'🦄',rar:3,era:5,hab:'The Glasswood',fav:'mana',g:{k:'reg',i:15},

  'Its horn sings at certain notes. Mira has learned three. Each one makes the cat sit up.',
  'In the glass forest at sunset, light bends around the unicorn in a halo. Everyone stops talking. Nobody breathes.']});
CR({id:'mammoth',n:'Frostmane Mammoth',i:'🦣',rar:3,era:5,hab:'Northern ice',fav:'food',

  'The Frostmane Mammoth carries an entire granary on its back. It does not mind. It looks quite pleased.',
  'Children climb its tusks. It tolerates this the way a mountain tolerates sunrise.',
  'When it trumpets, the whole district falls silent, then cheers. It is the sound of a place that is finally safe.']});
CR({id:'rhino',n:'Ironhide Rhino',i:'🦏',rar:2,era:5,hab:'Obsidian coast',fav:'iron',

  'Its armor is broken in nine places and it has never been prouder of anything.',
  'It plants itself in the courtyard and every gate in the empire seems a little harder to break.']});
CR({id:'hummingbird',n:'Crystal Hummingbird',i:'🐦',rar:3,era:5,hab:'Crystal grotto',fav:'mana',

  'It carries one seed of crystal to every district and plants it. A bright forest grows overnight.']});
CR({id:'basilisk',n:'Sunscale Basilisk',i:'🦂',rar:3,era:5,hab:'Scorched fields',fav:'gold',

  'It allows no one to steal from the treasury. Even you. Especially you.',
  'It sleeps under the empire\'s main vault. Thieves have a saying: "Dig elsewhere."']});
// ---- Era 6 ----

  'Its feathers carry weather. Wearing one is considered a political statement.',
  'It builds a nest on the highest spire of the empire, and every storm that passes bows to it.']});
CR({id:'leviathan',n:'Abyssal Leviathan',i:'🐋',rar:4,era:6,hab:'Deep ocean',fav:'mana',

  'The Abyssal Leviathan only speaks in whale song. Mira has translated one word. It was "patience."',
  'It swims the whole ocean in a day. It claims the ocean is "small" and that you are not.',
  'It rises beneath your flagship, lifts it to the sky, and lowers it again, unharmed. It was only saying hello.']});
CR({id:'dreamelk',n:'Dream Elk',i:'🫎',rar:3,era:6,hab:'The Dreaming Deep',fav:'mana',g:{k:'reg',i:17},
 pass:[ea('xp',1.025)],b5:[ea('offEff',.05)],b15:[ea('xp',1.5)],b30:[ea('offEff',.15)],

  'The Dream Elk walks in the sleep of every citizen. It leaves behind dreams of good harvests. Morning production is up.',
  'It shows you a dream of your first night in the ash. You\'re smaller than you remember. It is kind about it.',
  'The elk bows its antlers and a ladder of starlight forms. "Whenever you are ready," it says, "there is a place above all this."']});
CR({id:'phoenix',n:'Aether Phoenix',i:'🕊️',rar:4,era:6,hab:'Spire thermals',fav:'mana',

  'The Aether Phoenix burns each night and returns each morning, gently scolding you for staying up.',
  'When it burns, the spells in the realm brighten. Mages call it "the best seven minutes of the day."',
  'It does not fear death. It tells you this lightly, as if explaining a joke. You laugh. You realize it\'s telling you something true.']});
CR({id:'stormwyrm',n:'Stormcrown Wyrm',i:'🐉',rar:4,era:6,hab:'Wyrmrest spires',fav:'iron',g:{k:'reg',i:27},
 pass:[ea('armyMul',1.03)],b5:[ea('raidDef',1.25)],b15:[ea('armyMul',1.8)],b30:[ea('raidLoot',2)],

  'The Stormcrown Wyrm and Smolder are not friends. They do not speak. Yet they\'re never farther than a wing apart.',
  'The old dragons would not have approved of you. This one watches you work with a slow, curious blink.',
  'It breathes lightning into the sky, writing a single word across the clouds. The word is your name.']});
CR({id:'voidfox',n:'Void Fox',i:'🦊',rar:4,era:6,hab:'The Hollow Between',fav:'crystal',

  'The Void Fox is somewhere else most of the time. Sometimes it is somewhere else at the same time as it is here.',
  'It brings back a tiny object from each trip: a thimble, a star, a moment of silence.',
  'It sits at your feet and for the first time seems fully in one place. You realize this is a rare gift.']});
// ---- Era 7 ----
CR({id:'starstag',n:'Starfall Stag',i:'🌟',rar:4,era:7,hab:'Starfall plateau',fav:'crystal',g:{k:'reg',i:18},

  'The Starfall Stag has never been wet. Rain stops a few inches above it, out of courtesy.',
  'It speaks in constellations. Mira has translated eleven. Nine of them were insults.',
  'It lies down beside you under the stars. The sky seems closer. You wonder what it would take to touch it.']});
CR({id:'treantcub',n:'Heartwood Treant Cub',i:'🌱',rar:3,era:7,hab:'Hollowroot saplings',fav:'wood',g:{k:'chap',n:52},

  'The Treant Cub is learning to walk. It has already fallen into three wells and been rescued by all of them.',
  'It says its first word: "Hungry." Old Bark weeps. The rest of the realm brings snacks.',
  'It stands, shaking, on its own two roots, and looks up at the Hollowroot. For a moment the whole tree stands with it.']});
CR({id:'worldserpent',n:'World-Tree Serpent',i:'🐍',rar:5,era:7,hab:'Beneath the Hollowroot',fav:'mana',g:{k:'wonder',id:'w7'},

 lore:['As the Hollowroot Reborn blooms, something old uncoils beneath it: a serpent whose scales are bark and whose eyes are a pair of slow green moons. It bows its head to you. It has been waiting an age.',
  'The World-Tree Serpent circles the roots. Every tree it touches grows a ring faster. Foresters weep.',
  'It remembers the first seed. It tells you in dreams, never in words, and you wake with sap on your hands.',
  'It closes its mouth around its tail. A circle. A promise. The tree and the world and you are one thing.']});

// ===== part 6a: chapters 1-28 =====
const CHAPTERS=[];
function CH(n,c,txt){CHAPTERS.push({n,c,txt});}
// ---------------- ACT I: ASH AND ACORNS ----------------
CH('Ash and Acorns',{k:'tap',n:10},'You wake in the ashes beneath the Hollowroot, the dead World-Tree. A glowing window blinks: <b>[SYSTEM]</b> Welcome, Warden-Heir. Please tap things until civilization happens.');
CH('A Roof, Technically',{k:'bld',id:'woodcamp',n:3},'Three woodcutter camps stand. The trees are nervous. The System congratulates you for "aggressive optimism." You decide not to ask what it means.');
CH('Something With Scales',{k:'lvl',n:3},'A flameless dragon named Smolder limps out of the smoke and declares himself your bodyguard. He cannot yet defend a sandwich. He does not let this stop him.');
CH('Berries, Allegedly',{k:'bld',id:'forager',n:4},'Four foragers return from the burnt wood with baskets of berries. Half are edible. The other half are, according to Smolder, "an adventure."');
CH('Smoke From Chimneys',{k:'era',n:1},'The Glade becomes a Hamlet. Someone hung laundry. It is the most hopeful thing you have ever seen.');
CH('First Rent',{k:'bld',id:'cottage',n:5},'Five cottages. Five families. Five completely different opinions about where the road should go. You begin to understand what "governing" means.');
CH('The Orcs Send a Letter',{k:'raid',n:1},'You repelled your first raid. The orcs left a strongly worded note and one boot. The note is signed: <i>"With regards, from the Collector of the Hollow Tithe."</i> You have no idea what that means. Yet.');
CH('A Friend With Fur',{k:'cre',n:1},'You find someone sitting in your road who is not a citizen. They\'re not a threat, either. They\'re just here, and they are a friend. Check the Menagerie. Creatures bond with you, and give you strength.');
CH("Lady Sylvara's Satchel",{k:'comp',n:2},'A noblewoman arrives with a satchel of herbs and a title nobody remembers. She starts fixing everyone anyway. She does not say her last name. Yet.');
CH('The Class of Things',{k:'lvl',n:10},'Level 10. The System offers you a choice: <i>"Choose a Class."</i> You ask what happens if you refuse. It replies: <i>"Then you will be a Warden. Which is a class. Please choose."</i>');
CH('Pie Economics',{k:'tot',res:'food',n:20000},'Twenty thousand portions of food have passed through your hands. Someone invents the pie. The entire economy reorganizes around it by Tuesday.');
CH('Council of Stumps',{k:'era',n:2},'Village status achieved. A council forms. It meets on literal stumps and argues about stump seating. You are told this is "the beginning of democracy."');
// ---------------- ACT II: ROOTS ----------------
CH('Maps Are for Winners',{k:'reg',n:1},'The first region answers to you. A scout hands you a map. The map is mostly wishful thinking, with one accurate river. You frame it.');
CH("Tuck's Ledger",{k:'comp',n:3},'A rabbitfolk quartermaster arrives with seventeen carts, a ledger, and a firm no-refunds policy. The ledger has a single page dedicated to you. It is titled "Trouble."');
CH('Scribbles in Bark',{k:'tech',n:5},'Five discoveries inscribed in bark. Your scribes complain about parchment. Your woodcutters complain about scribes. The bark has no comment.');
CH('A Hundred Doors',{k:'bldn',n:100},'A hundred buildings. Someone makes a sign that says "Welcome to Hollowroot." Someone else makes a sign that says "Welcome to Hollow." The first sign is kept.');
CH('The Map Gets Colored',{k:'reg',n:3},'Three regions answer to you. The old maps are redrawn in your favorite shade of green.');
CH("The Collector's Letter",{k:'raid',n:5},'A formal scroll arrives, sealed in black wax: <i>"The Hollowroot\'s lands are collateral. The debt has come due. Pay in full or be collected. — Magister Corvane Vael, Collector of the Hollow Tithe."</i> Smolder sneezes on it.');
CH('A Menagerie Begins',{k:'cre',n:3},'Three creatures now call your realm home. A citizen suggests naming the district "Beastville." The creatures vote it down. In squeaks and a snort.');
CH('The Weight of Leaves',{k:'lvl',n:18},'Level 18. Your body feels different. The System congratulates you on "adequate progress." Smolder pats your leg with a wing and says it is the nicest thing he has said all week.');
CH('The Mossbound Gate',{k:'wonder',n:1},'You complete your first wonder. It is a gate. It leads nowhere. Everyone is deeply moved. Smolder flies through it three times to be sure.');
CH('Five Hundred Hands',{k:'pop',n:500},'Five hundred citizens. The tavern ran out of chairs. The tavern is thrilled, and charges rent for standing.');
CH('A Friendship With Fur',{k:'bond',n:10},'A creature\'s bond reaches level 10 and begins to do something wonderful: it lends you a Skill. Open the Menagerie and see what your friend can do. And thank them. They like that.');
CH('Town of Scholars',{k:'era',n:3},'Town walls rise. A library appears. Orrin draws plans for walls that build walls. You approve a smaller idea, which he immediately resents and perfects.');
// ---------------- ACT III: BRANCHES ----------------
CH('Orrin Falls From a Crate',{k:'comp',n:4},'A gnome falls out of a crate marked FRAGILE and immediately starts redesigning your walls. He has seen your drawings and calls them "adorable." You\'re not sure whether to hire him or hide.');
CH('Library of Leaves',{k:'tech',n:12},'Twelve discoveries. Your scribes run out of parchment and start using bark. The bark does not mind. The bark has begun to answer back.');
CH('Five Provinces',{k:'reg',n:5},'Five regions. Governors are chosen by lottery, which goes badly, then very well, then badly again. The system, you learn, is "a work in progress."');
CH('The Wall Holds',{k:'raid',n:15},'Fifteen raids repelled. The Collector\'s soldiers wear black and march in perfect step. The captain\'s helmet is stamped with a ledger. You wonder who they are paying.');
CH('Tides of Power',{k:'lvl',n:40},'Level 40. The System pauses before congratulating you: <i>"Warden. You are growing faster than the Hollowroot ever predicted. Please be careful."</i> You ask what it means. It does not answer.');
CH('Wild Hearts',{k:'cre',n:6},'Six creatures. A farmer insists his sheep are jealous. The sheep are jealous. They begin a nonviolent protest in the pasture.');
CH('Mira Walks Out of the Fen',{k:'comp',n:5},'Mira Thistle arrives with a cat, a cauldron, and a strict policy on small talk. She looks at the Hollowroot for a long time and says, quietly, <i>"It\'s still alive. Barely."</i>');
CH('Gold in the Hands',{k:'tot',res:'gold',n:50000000},'Merchants arrive from lands you\'ve never heard of. One of them offers to buy the sunset. Tuck negotiates. You are not sure what the sunset is worth, but you know it is more than he paid.');
CH('Shrine of the First Leaf',{k:'wonder',n:2},'The shrine stands. Citizens leave offerings of acorns and slightly regrettable poetry. A leaf on the Hollowroot unfurls. Just one. It\'s green. Mira cries into her cat.');
CH('Deep Bonds',{k:'bond',n:20},'A bond reaches level 20. The creature looks up at you in the evening light, and for a moment you see in its eyes the thing the System keeps calling "belonging."');
CH('A Town Becomes a City',{k:'pop',n:5000},'Five thousand citizens. A baker opens a second bakery to compete with her first. Nobody understands, and everybody eats.');
CH('City of Spires',{k:'era',n:4},'Towers where there were stumps. A bard writes a song about you. It rhymes "Warden" with "hordin\'." You request a different bard. They send the same one, wearing a hat.');
// ---------------- ACT IV: CANOPY ----------------
CH('The Eight Banners',{k:'reg',n:8},'Eight regions fly your banner. A scout from the east reports that the Collector has moved his headquarters to a fortress "that looks like a tombstone with ambition."');
CH('The Thousand Banners',{k:'pow',n:100000000},'A hundred million strong in might. Foes now send flowers before they send raids. The flowers are poisoned, but it is the thought that counts.');
CH('Metamorphosis',{k:'evo',n:1},'A creature, bonded to the final level, transforms. Light rolls around it like water. When it fades, a grander form stands in its place, and it still leans against your leg like it did the first day.');
CH("Wanderers' Return",{k:'exp',n:20},'Twenty expeditions return. A scout brings a map, a relic, and a stone she insists is "a shy dragon egg." It is a stone. She is thrilled.');
CH('The Weight of Crowns',{k:'lvl',n:70},'Level 70. You find you have started to speak like a king, in short sentences with large pauses. Smolder tells you to stop. You do. For nine minutes.');
CH('Library of Sap-Script',{k:'wonder',n:4},'The Library opens. Its books are written in sap and are slightly sticky. Scholars wash their hands more than they read. Still, the knowledge enters the realm and lives there.');
CH('Ten Provinces',{k:'reg',n:10},'Ten regions. Governors are appointed. Two are immediately appointed to a different region as "a promotion."');
CH('Crown of Branches',{k:'era',n:5},'You are now a Kingdom. A crown of woven branches is placed on your head. It is itchy. It is yours. Smolder pretends not to be impressed and fails.');
CH('Grakk Lowers His Axe',{k:'comp',n:6},'An orc captain lowers his axe at the gate. "I have read your pamphlet," he says. "The pay is better." Smolder looks at you. You look at Smolder. The pamphlet, it turns out, was Tuck\'s.');
CH('Fifteen Friends',{k:'cre',n:15},'Fifteen creatures. The realm has taken to calling them "the Wild Court." They hold meetings in the orchard. Nothing gets decided. It is wonderful.');
CH('Bonded Beyond Words',{k:'bond',n:25},'A creature\'s bond passes level 25. There are no more words. There are looks, leans, and the slow blink of an animal that has decided you\'re family.');
CH('Crystal Rain',{k:'tot',res:'crystal',n:1000000},'A million crystal pass through your hands. Mages pin them to their robes. Children skip them on ponds. The Collector\'s spies begin to whisper that you are "dangerously cheerful."');
// ---------------- ACT V: STORM ----------------
CH('A Hundredth Shield',{k:'raid',n:100},'One hundred raids repelled. The Collector\'s captain finally sends a message that is not a threat: <i>"Why do you keep winning?"</i> Smolder, from the rafters, writes back: "Because we like it here."');
CH('Ten Million Spears',{k:'pow',n:10000000000000},'Ten trillion in might under your banner. The Collector pauses his advance. For the first time in a thousand years, someone has made the Ledger blink.');
CH('Empire, Reluctantly',{k:'era',n:6},'Empire. The word feels big in your mouth. The System says: <b>[SYSTEM]</b> <i>Please do not become a villain. Thank you.</i> You promise. Smolder holds you to it with a stern, tiny frown.');
CH('Old Bark Clears His Throat',{k:'comp',n:7},'A stump in the glade clears its throat. It has been waiting four hundred years to say, "Finally." He knew the old kings. He knew the Planting. He knows what the Ledger is. He has been waiting for someone who would ask.');
CH('Fourteen Banners',{k:'reg',n:14},'Fourteen regions. Old Bark tells you why the Collector wants the Hollowroot: it was not stolen, but <i>borrowed against</i>. By a king. In a hurry. For a good reason.');
CH('Level One Hundred',{k:'lvl',n:100},'Level 100. Bards fight over your biography. You resolve it by publishing your own. It is mostly accurate. Smolder is described as "a minor character." He is not speaking to you.');
CH('Three Transformations',{k:'evo',n:3},'Three of your friends have transformed. The realm throws a festival. A dragon, a moth, and a tortoise lead the parade. The tortoise is last. It is also the one everyone cheers for.');
CH("The Dragon's Spire",{k:'wonder',n:5},'The Dragon\'s Spire rises. Smolder lands on its tip, spreads his wings, and breathes a perfect, steady, three-foot flame. Everyone claps. He pretends he did not cry.');
CH('Sixteen Provinces',{k:'reg',n:16},'Sixteen provinces. The cartographer demands a raise and a better pen. You grant both. The pen is a feather from the Thunder Roc. He frames it instead.');
CH('Thirty Discoveries',{k:'tech',n:30},'Thirty discoveries. Orrin builds a machine to do your research for you. It writes one line: "More tea." You give it more tea. It works faster.');
CH('Twenty Hearts',{k:'cre',n:20},'Twenty creatures call your realm home. You realize some have formed friendships with each other. A tortoise and a hummingbird watch sunsets together. No one talks about it.');
CH('Contracts Fulfilled',{k:'bount',n:10},'Ten bounties fulfilled. The Board overflows with notes of thanks. One reads only: "Thank you for the sunrise." You do not remember providing it.');
// ---------------- ACT VI: HEARTWOOD ----------------
CH('The Tree Remembers',{k:'era',n:7},'The Hollowroot stirs. A sprout. A single, glowing leaf. The entire realm holds its breath. The System speaks, and the voice is no longer a window: <i>"Warden. I am ready to tell you who I am."</i>');
CH('Eighteen Regions',{k:'reg',n:18},'Eighteen regions. The System tells you: <i>"I am the Hollowroot. I have been dreaming for four hundred years. Forgive the jokes. They were all I had."</i> You laugh. You sit. Smolder sits with you.');
CH('Aether Colossus',{k:'wonder',n:6},'The Aether Colossus stands. It hums. A million tiny lights run along its limbs. The Hollowroot says: <i>"That is how it feels, when you are not alone."</i>');
CH('Level One Thirty',{k:'lvl',n:130},'Level 130. Your power is no longer measured in muscle but in how many people don\'t have to be afraid. Sylvara tells you that is the only real kind. She is right. It is annoying.');
CH('Twenty Banners',{k:'reg',n:20},'Twenty regions. The Collector sends one more letter: <i>"I would like to speak. Not as an enemy. As the only one left who remembers."</i> The letter smells of old paper and older grief.');
CH('Eight Transformations',{k:'evo',n:8},'Eight friends transformed. The Wild Court holds its first formal council. They elect Pip as speaker. Nobody can say why. It does an excellent job.');
CH('A Bond Without End',{k:'bond',n:30},'A bond reaches its limit. The creature does not know it is a limit. It simply leans in, and you lean in, and the Hollowroot hums a low, steady note of approval.');
CH('Forty-Five Discoveries',{k:'tech',n:45},'Forty-five discoveries. Your archive fills with maps, songs, and a recipe for soup that makes you remember your mother\'s hands. You write it down immediately.');
CH('The Hollowroot Reborn',{k:'wonder',n:7},'The Hollowroot Reborn stands complete. The old world is gone. The new one has your name on the gate. And the roots stir, and something ancient uncoils beneath them. It bows.');
CH('Choices That Echo',{k:'tale',n:8},'Eight tales decided. The Hollowroot says: <i>"You are a different Warden now than the one who woke in the ash."</i> You are. You didn\'t notice.');
CH('Thirty Species',{k:'cre',n:30},'Thirty species. The Wild Court has a flag. It is a leaf, a paw print, and a very small crown. Pip designed it. The crown is not to scale.');
CH('Again, But Wiser',{k:'prest',n:1},'You Rebirth. The realm resets; the lessons do not. The Hollowroot whispers: <i>"Warden, you have done this before. Let us do it better. And this time, let us remember the little things."</i>');
// ---------------- ACT VII: EVERGREEN ----------------
CH('The Collector Speaks',{k:'reg',n:24},'The Collector arrives at your gate alone, in a black coat stitched with names. He is older than he looks. He says, "I am not here to collect. I am here because someone should finally ask me why."');
CH('Level One Sixty',{k:'lvl',n:160},'Level 160. The Collector watches you work for a day and a night. He leaves a note: <i>"You are doing it the way my brother never could. Slowly. With others."</i>');
CH('Third Spring',{k:'prest',n:3},'Your third Rebirth. The Hollowroot blooms earlier than ever. The Collector, standing at your gate, finally sits down. "I forgot," he says, "that I could."');
CH('Fifteen Transformations',{k:'evo',n:15},'Fifteen friends transformed. The Wild Court stages a pageant retelling your story. It is wildly inaccurate and exactly right. Smolder is played by a very tall hen.');
CH('Twenty-Seven Banners',{k:'reg',n:27},'Twenty-seven regions. The Collector opens the Ledger and shows you the first page. It reads: <i>"Borrowed: one winter, to keep a kingdom warm. Owed: everything."</i> He closes it. His hands tremble.');
CH('Tales Told',{k:'tale',n:14},'Fourteen tales decided. You have become, the Hollowroot says, <i>"a person who is known by what they chose, rather than what they were given."</i>');
CH('Level One Ninety',{k:'lvl',n:190},'Level 190. The edge of the System itself. Beyond the final level, the Hollowroot says, there is no more number. Only the work. The work, you realize, is what you wanted anyway.');
CH('Thirty-Eight Friends',{k:'cre',n:38},'Thirty-eight creatures. Even the shy ones. A single empty place remains in the orchard, reserved for someone yet to come. Nobody has asked. Everyone is waiting.');
CH('The Evergreen Heart',{k:'reg',n:30},'All thirty regions. The map is entirely your color. The Hollowroot tells you: <i>"I am the whole map now. And I am still afraid of being cut down."</i> You promise to protect it. You mean it.');
CH('A Worldseed',{k:'asc',n:1},'You Ascend. A single golden seed lies in your palm. The Hollowroot: <i>"Plant it. Not for me. For the next Warden. And the one after. That is what it means to be alive."</i>');
CH('Level Two Hundred',{k:'lvl',n:200},'Level 200. The System goes silent for a very long time. Then: <i>"Warden. There are no more levels. There is only what you do next."</i> It adds, quietly: <i>"Thank you for the jokes."</i>');
CH('The Complete Menagerie',{k:'cre',n:CRS.length},'Every creature in the realm is yours. The empty place in the orchard fills, at last, with a small, round, ordinary dog. It looks at you, wags its tail once, and falls asleep. The Hollowroot hums. The saga of the Warden has an end, and an after, and a long, green, unfinishing spring.');

const TALES=[];

TL('stump',6,'The Stump That Wouldn\'t Move','A stump sits in the middle of your first road. It has been there four hundred years. Builders are staring at it. It, maybe, is staring back.',[
 {l:'Chop it down',r:'The axes ring. The stump falls with a sigh. You feel, briefly, like a person who has done a thing.',eff:[mr('wood',1.1)]},
 {l:'Build around it',r:'The road bends gracefully. The stump becomes a landmark. Travelers use it for directions.',eff:[ea('popMul',1.05)]},
 {l:'Politely ask it to move',r:'A long silence. Then, with a creak, the stump rolls aside and begins to grow. Nobody is more surprised than the stump.',eff:[ea('click',1.12)]}]);
TL('piethief',10,'The Pie Thief','The first pie has gone missing from the windowsill. A small trail of crumbs leads to a very full child. The baker is furious. The child is crying. The pie was, reportedly, excellent.',[
 {l:'Make an example',r:'The child must clean the bakery for a week. The bakery has never been so clean. The child has never been so loved.',eff:[ea('raidDef',1.05)]},
 {l:'Forgive and share the pie',r:'Pie for everyone. The child is tomorrow\'s baker, and the creature outside the window knows it.',eff:[ea('bond',1.1)]},
 {l:'Hire the child as official taster',r:'The child is soon the most respected critic in the realm. The baker\'s pies improve. Mostly out of fear.',eff:[mr('food',1.1)]}]);
TL('tuckdebt',14,'Tuck\'s Fine Print','Tuck presents a contract in tiny writing. It is, as far as you can tell, a good deal. It is also forty pages long and includes the phrase "and all heirs." He looks at you with innocent eyes.',[
 {l:'Sign it',r:'Gold flows. Somewhere, a clause activates. You will find out which one in a few years.',eff:[mr('gold',1.12)]},
 {l:'Have Sylvara read it',r:'She finds three traps and a recipe for stew. The stew is excellent. The traps are removed.',eff:[ea('costRed',.02)]},
 {l:'Tear it up and shake hands',r:'Tuck weeps. He\'s never had that before. His prices drop for a year, then a decade.',eff:[ea('bond',1.1)]}]);
TL('letter',18,'The Collector\'s Offer','Corvane\'s letter proposes terms. Surrender the Hollowroot, and your realm may keep its roofs. Smolder snarls. Sylvara frowns. Tuck is calculating. The System says nothing, but the leaves on the Hollowroot tremble.',[
 {l:'Defy him',r:'Your reply is one word. Smolder suggests an additional one. Your army swells with volunteers.',eff:[ea('armyMul',1.1)]},
 {l:'Negotiate',r:'You propose a payment plan. The Collector doesn\'t answer, but the raids slow. Tuck takes credit.',eff:[mr('gold',1.1)]},
 {l:'Burn the letter',r:'It burns green. The ashes smell like old paper and something sadder. You tell no one.',eff:[ea('mulAll',1.04)]}]);
TL('cubs',22,'The Orphaned Cubs','Three small creatures huddle on the edge of the orchard. Their parent did not come back from the road. They shiver. They are wild, and they are hungry. They look at you.',[
 {l:'Adopt them',r:'The cubs move into the stable. They bite everyone. They also guard everyone. The stable becomes the loudest, warmest place in the realm.',eff:[ea('crMul',1.1)]},
 {l:'Return them to the wild',r:'You carry them to the edge of the forest. They look back once. Later, a pawprint appears on your doorstep: a thank-you.',eff:[ea('crLuck',.15)]},
 {l:'Ask Sylvara to nurse them',r:'Sylvara hums while she works, and by morning all three are fat and sleepy. She falls asleep in a chair with a cub on each arm.',eff:[ea('xp',1.1)]}]);
TL('rune',26,'The Rune in the Library','A scribe finds a glowing rune scratched into a shelf, under centuries of dust. It pulses when you walk near. The scribe backs away with a very polite look of dread.',[
 {l:'Study it',r:'The rune is a map of the Hollowroot\'s roots. It rewrites itself as you read. You come away with a headache and a plan.',eff:[ea('rSpeed',1.12)]},
 {l:'Seal it away',r:'The shelf is boarded up. Mira watches in silence, then quietly nods.',eff:[ea('spellCost',.95)]},
 {l:'Burn the shelf',r:'It burns blue. The library smells of cinnamon for a week. The rune is gone, but you feel lighter.',eff:[ea('mulAll',1.04)]}]);
TL('flight',30,'Smolder\'s First Flight','Smolder stands on the edge of the tallest tower, flapping very hard. He\'s been trying all week. He would like you to watch. He would also like you to pretend you didn\'t.',[
 {l:'Let him jump',r:'He falls, flaps, and catches the wind. For two minutes, he flies. He lands on a chimney and refuses to come down until dinner.',eff:[ea('click',1.15)]},
 {l:'Catch him if he falls',r:'You stand below with your arms out. He doesn\'t fall. He glides in a long lazy spiral and lands on your shoulders. Heavy. Perfect.',eff:[ea('raidDef',1.1)]},
 {l:'Fly with him',r:'You climb the tower. You both jump. It goes badly. It goes well. By the end you\'re both lying in a haystack, laughing.',eff:[ea('xp',1.12)]}]);
TL('wall',33,'The Mourning Wall','A citizen has been quietly leaving flowers at the foot of a blank wall. Others have joined. They never say who they\'re mourning. They\'re mourning someone. They\'re all mourning someone.',[
 {l:'Build a memorial wall',r:'Names are carved. Every name is a person someone loved. The wall is never empty of flowers again.',eff:[ea('popMul',1.05),ea('xp',1.05)]},
 {l:'Leave it as it is',r:'You stand there at night, alone. You think of someone. You do not say who. The wall says nothing back, which is the point.',eff:[ea('bond',1.1)]},

TL('traitor',37,'The Traitor on the Council','A councilor has been selling your patrol schedules to the Collector. The evidence is a ledger page, a single glove, and the councilor\'s trembling face.',[

 {l:'Forgive, with a warning',r:'The councilor kneels. Weeks later, they warn you about an ambush. It saves a thousand lives.',eff:[ea('popMul',1.05),ea('bond',1.05)]},

TL('cat',42,'Mira\'s Cat','Mira\'s cat has been sitting on your throne for three days. It refuses to move. When you finally pick it up, it speaks. It says: "I am the Queen of the Hollow Wood. I would like my crown back."',[

TL('winter',47,'The Hunger Winter','The harvest fails in the east. Refugees stream toward your gates. Your stores are good. Not good enough for everyone. The council turns to you.',[
 {l:'Store grain for your own',r:'Your people eat, barely. The refugees keep walking. The creatures follow them out for a mile and then, quietly, turn back.',eff:[mr('food',1.15)]},
 {l:'Open the gates',r:'Everyone eats less. Everyone eats. The city grows. And the refugees never forget.',eff:[ea('popMul',1.08)]},

TL('barkmem',52,'Old Bark\'s Memory','Old Bark offers to show you the Planting, the day the Hollowroot was seeded. It requires you to dream. It requires you to be honest. It requires, he says, that you not wake up angry.',[
 {l:'Watch the whole dream',r:'You see the first king, young, tired, planting a seed with his brother beside him. They are laughing. You wake with tears on your face.',eff:[ea('xp',1.2)]},
 {l:'Ask about the Ledger',r:'The dream darkens. A hand signs a page. The hand is not the king\'s. It is his brother\'s. Old Bark does not look at you. You do not ask again.',eff:[mr('gold',1.15)]},

TL('dinner',58,'The Embassy Dinner','Ambassadors from six nations dine in your hall. A flute plays. A creature stole the soup. An ambassador is furious. Another is delighted. A third is pretending not to be delighted.',[
 {l:'Smooth it over with gifts',r:'The ambassadors leave with arms full of wonders. Your treasury weeps. Your reputation sings.',eff:[ea('bond',1.1)]},

TL('clans',63,'The Sky Clans\' Terms','The Sky Clans agree to treaty, on one condition: your armies never fly above the clouds. It is a fair price. It is also a limit you hadn\'t planned on.',[

TL('seedcrown',69,'The Seed of the Crown','The Hollowroot, reborn, offers you a single seed. It says: "This is the seed of the crown. Plant it in a person, and they are king. Plant it in the earth, and the earth is king. Plant it in you, and you are what you decide."',[

 {l:'Give it to the people',r:'It is divided into a thousand seeds and planted in a thousand gardens. Nobody wears a crown. Everybody wears a leaf.',eff:[ea('popMul',1.12)]},

TL('ledger',76,'The Ledger','The Collector places the Ledger on your table. It is a heavy book bound in black. The debt is real. The creditor is long gone. The Collector is the last who remembers it. He asks only that you decide: what is owed?',[
 {l:'Forgive the debt',r:'You write one word across the final page: PAID. The Ledger turns to ash. The Collector exhales. Four hundred years of grief leave his shoulders like birds.',eff:[ea('mulAll',1.15),ea('gain',1.2)]},

const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg'];
function fmt(n,d){
 if(d===undefined)d=2;
 if(n===undefined||n===null||isNaN(n))return '0';
 if(!isFinite(n))return '∞';
 if(n<0)return '-'+fmt(-n,d);
 if(n<1000){if(n>=100)return String(Math.floor(n));if(n>=10)return (Math.round(n*10)/10).toString();return (Math.round(n*100)/100).toString();}
 const e=Math.floor(Math.log10(n)/3);
 if(e<SUF.length&&(!G.s||G.s.set.notation!=='sci')){return (n/Math.pow(1000,e)).toFixed(d)+SUF[e];}
 const x=Math.floor(Math.log10(n));return (n/Math.pow(10,x)).toFixed(2)+'e'+x;
}
function fmtTime(sec){
 sec=Math.max(0,Math.floor(sec));
 if(sec<60)return sec+'s';
 if(sec<3600)return Math.floor(sec/60)+'m '+(sec%60)+'s';
 if(sec<86400)return Math.floor(sec/3600)+'h '+Math.floor(sec%3600/60)+'m';
 return Math.floor(sec/86400)+'d '+Math.floor(sec%86400/3600)+'h';
}

function applyEff(S,e,m){
 if(m===undefined)m=1;
 if(e.t==='mulRes'){const f=Math.pow(e.v,m);resList(e.res).forEach(r=>{S.mulRes[r]*=f;});return;}
 if(e.t in MULT_T){S[e.t]*=Math.pow(e.v,m);return;}
 S[e.t]=(S[e.t]||0)+e.v*m;
}

function computeStats(){
 const s=G.s,S={mulRes:{},workPct:.03,clickPct:.03,costRed:0,unitCost:0,crit:.05,offCap:8,offEff:.5,edictSlots:1,expSlots:1,resSlots:1,crSlots:1,crLuck:0};
 for(const k in MULT_T)S[k]=1;
 RES_ORDER.forEach(r=>S.mulRes[r]=1);
 for(const id in s.techs)applyEffs(S,TMAP[id].eff);
 // hero
 const a=s.hero.attr;
 S.click*=1+.015*a.str;S.armyMul*=1+.008*a.str;
 S.crit+=.004*a.dex;S.expSpeed*=1+.005*a.dex;
 S.rSpeed*=1+.006*a.int;S.spellCost*=Math.max(.5,1-.003*a.int);
 S.xp*=1+.01*a.wis;S.offEff+=.002*a.wis;
 S.mulRes.gold*=1+.006*a.cha;S.popMul*=1+.003*a.cha;S.bond*=1+.01*a.cha;
 S.raidDef*=1+.008*a.vit;S.mulAll*=1+.002*a.vit;
 for(const id in s.hero.skills){const sk=SMAP[id];if(sk)applyEffs(S,sk.eff,s.hero.skills[id]);}
 const g=s.hero.gear;
 S.click*=Math.pow(1.12,g.weapon);S.armyMul*=Math.pow(1.04,g.weapon);
 S.raidDef*=Math.pow(1.1,g.armor);S.popMul*=Math.pow(1.02,g.armor);
 S.mulAll*=Math.pow(1.03,g.trinket);
 S.xp*=Math.pow(1.05,g.crown);S.spellCost*=Math.pow(.99,g.crown);
 for(const id in s.comp)applyEffs(S,CMAP[id].eff,s.comp[id].lvl);
 for(const id in s.regions)applyEffs(S,REG[+id.slice(1)].eff);
 for(const id in s.wonders)applyEffs(S,WMAP[id].eff);
 s.edicts.forEach(id=>applyEffs(S,EMAP[id].eff));
 for(const id in s.relics)applyEffs(S,RLMAP[id].eff);
 BLD.forEach(b=>{if(b.type==='civic'){const c=s.bld[b.id]||0;if(c)applyEff(S,b.eff,c);}});
 const gr=s.bld.grove||0;if(gr)S.popGrow*=Math.pow(1.05,gr);
 const rc=s.bld.roost||0;if(rc)S.armyMul*=Math.pow(1.01,rc);
 SHOP.forEach(sh=>{const l=shopLvl(sh.id);if(l&&sh.eff)applyEffs(S,sh.eff,l);});
 S.mulAll*=Math.pow(1+0.05*s.pres.total,.35);
 S.mulAll*=Math.pow(1.1,0);
 S.mulAll*=Math.pow(1.1,shopLvl('legacy')*0); // applied via SHOP eff
 let ac=0;for(const k in s.ach)ac++;S.mulAll*=1+0.01*ac;S.achCount=ac;
 const pl=pillarLevels();S.pl=pl;
 S.mulRes.gold*=Math.pow(1.06,pl.econ);S.costRed+=.005*pl.econ;
 ['wood','stone','iron'].forEach(r=>S.mulRes[r]*=Math.pow(1.05,pl.ind));
 S.armyMul*=Math.pow(1.06,pl.mil);
 S.mulRes.mana*=Math.pow(1.07,pl.arc);S.mulRes.crystal*=Math.pow(1.05,pl.arc);
 S.xp*=Math.pow(1.05,pl.cul);S.bond*=Math.pow(1.04,pl.cul);
 S.raidDef*=Math.pow(1.06,pl.stab);S.popMul*=Math.pow(1.03,pl.stab);
 applyTales(S);
 ASHOP.forEach(a=>{const l=ascLvl(a.id);if(l&&a.eff)applyEffs(S,a.eff,l);});
 S.mulAll*=Math.pow(1+0.5*s.asc.seeds*S.seed,.6);
 S.crSlots+=(s.era>=2?1:0)+(s.era>=4?1:0)+(s.era>=6?1:0);
 creatureStats(S);
 applySeason(S);
 // buffs
 const now=Date.now(),b=s.buffs;
 const on=id=>b[id]&&b[id]>now;
 if(on('surge'))S.mulAll*=3;
 if(on('roar'))S.click*=10;
 if(on('skin'))S.raidDef*=3;
 if(on('fall'))S.armyMul*=4;
 if(on('song')){S.xp*=5;S.bond*=3;}
 S.costRed=Math.min(.6,S.costRed);S.unitCost=Math.min(.5,S.unitCost);S.crit=Math.min(.6,S.crit);
 S.spellCost=Math.max(.25,S.spellCost);S.spellCd=Math.max(.2,S.spellCd);
 S.crSlots=Math.min(9,Math.floor(S.crSlots+1e-9));S.edictSlots=Math.floor(S.edictSlots);S.expSlots=Math.floor(S.expSlots);S.resSlots=Math.floor(S.resSlots);
 return S;
}
function bMult(count){let m=1;for(let i=0;i<MIL.length;i++){if(count>=MIL[i])m*=2;else break;}return m;}
function nextMil(count){for(let i=0;i<MIL.length;i++)if(count<MIL[i])return MIL[i];return null;}
function popCap(){
 let cap=2;BLD.forEach(b=>{if(b.type==='house')cap+=(G.s.bld[b.id]||0)*b.pop;});
 return Math.floor(cap*G.S.popMul);
}
function totalWorkers(){let n=0;for(const r of RES_ORDER)n+=G.s.work[r]||0;return n;}
function computeRates(){
 const s=G.s,S=G.S,out={},base={};
 RES_ORDER.forEach(r=>{base[r]=0;});
 BLD.forEach(b=>{if(b.type==='prod'){const c=s.bld[b.id]||0;if(c)base[b.res]+=c*b.rate*bMult(c);}});
 RES_ORDER.forEach(r=>{
  const w=s.work[r]||0;
  const wm=1+S.workPct*S.mulWork*Math.pow(w,.7);
  const flat=w*.05*Math.pow(2,s.era)*S.mulWork;
  out[r]=(base[r]*wm+flat)*S.mulAll*S.mulRes[r];
 });
 G.rates=out;G.base=base;
 let vr=0;RES_ORDER.forEach(r=>vr+=out[r]*RES[r].v);
 G.valueRate=vr;
 G.xps=(.4+.015*Math.pow(vr,.3))*S.xp;
}
function recalc(){G.S=computeStats();computeRates();G.dirty=false;}
function tapValue(){
 const r=G.s.focus,S=G.S;
 return (1+G.rates[r]*S.clickPct)*S.click;
}
// ---- costs ----
function bCostN(b,n){
 const owned=G.s.bld[b.id]||0,g=b.g;
 const f=Math.pow(g,owned)*(Math.pow(g,n)-1)/(g-1)*(1-G.S.costRed);
 return b.cost.map(c=>[c[0],c[1]*f]);
}
function canPay(cost){for(const c of cost)if((G.s.res[c[0]]||0)<c[1])return false;return true;}
function pay(cost){cost.forEach(c=>{G.s.res[c[0]]-=c[1];});}
function maxAffordN(base,g,owned,disc,res){
 let best=Infinity;
 for(const c of base){
  const a=c[1]*Math.pow(g,owned)*disc,have=G.s.res[c[0]]||0;
  if(have<a)return 0;
  const n=Math.floor(Math.log(1+have*(g-1)/a)/Math.log(g)+1e-9);
  best=Math.min(best,n);
 }
 return isFinite(best)?best:0;
}
function bMaxN(b){return maxAffordN(b.cost,b.g,G.s.bld[b.id]||0,1-G.S.costRed);}
function uCostN(u,n){
 const owned=G.s.unit[u.id]||0,g=UG;
 const f=Math.pow(g,owned)*(Math.pow(g,n)-1)/(g-1)*(1-G.S.unitCost);
 return u.cost.map(c=>[c[0],c[1]*f]);
}
function uMaxN(u){return maxAffordN(u.cost,UG,G.s.unit[u.id]||0,1-G.S.unitCost);}
function armyPower(){
 let p=0;UNITS.forEach(u=>{p+=(G.s.unit[u.id]||0)*u.p;});
 return p*G.S.armyMul;
}
function totalUnits(){let n=0;for(const k in G.s.unit)n+=G.s.unit[k];return n;}
function xpNeed(l){return 35*l*Math.pow(1.14,l);}
function unlockedRes(){return RES_ORDER.filter(r=>RES[r].era<=G.s.era);}


// ===== engine part 2: actions and tick =====
function addRes(r,amt){
 const s=G.s;s.res[r]+=amt;s.tot[r]+=amt;s.life[r]+=amt;
}
function runScore(){let t=0;RES_ORDER.forEach(r=>t+=G.s.tot[r]*RES[r].v);return t;}
function addXp(x){
 const h=G.s.hero;if(h.lvl>=200)return;
 h.xp+=x;
 let up=0;
 while(h.lvl<200&&h.xp>=xpNeed(h.lvl)){
  h.xp-=xpNeed(h.lvl);h.lvl++;h.pts+=3+(h.lvl%10===0?2:0);h.sp+=1;up++;
 }
 if(h.lvl>=200)h.xp=0;
 if(up){
  G.dirty=true;
  const q=['Stats increased. Confidence unchanged.','You feel stronger. Your back disagrees.','Reality nods approvingly.','The System applauds. Slowly.'];
  sys('Level '+h.lvl+'! +'+(3*up)+' attribute points and '+up+' skill point'+(up>1?'s':'')+'. '+q[h.lvl%q.length]);
  toast('⭐ Level '+h.lvl+'!');
  emit('struct');
 }
}
function xpReward(frac){return xpNeed(G.s.hero.lvl)*frac;}
function tap(){
 const s=G.s;
 let v=tapValue(),crit=false;
 if(Math.random()<G.S.crit){v*=G.S.critMul;crit=true;}
 addRes(s.focus,v);s.st.taps++;
 addXp(Math.max(.2,G.xps*.2));
 return {v,crit};
}
// ---- buildings ----
function bAvailable(b){return b.era<=G.s.era;}
function buyBuilding(id,n){
 const b=BMAP[id];if(!b||!bAvailable(b))return 0;
 n=Math.min(n,bMaxN(b));if(n<1)return 0;
 const cost=bCostN(b,n);if(!canPay(cost))return 0;
 pay(cost);G.s.bld[id]=(G.s.bld[id]||0)+n;G.s.st.builds+=n;G.dirty=true;
 const c=G.s.bld[id];
 if(MIL.indexOf(c)>=0||(n>1&&MIL.some(m=>c>=m&&c-n<m)))sys(b.n+' milestone! Output doubled.');
 emit('struct');return n;
}
function bestBuy(){
 // cheapest payback among affordable producers
 let best=null,bs=Infinity;
 BLD.forEach(b=>{
  if(!bAvailable(b))return;
  const c=bCostN(b,1);if(!canPay(c))return;
  let val=0;c.forEach(x=>val+=x[1]*RES[x[0]].v);
  const gain=b.type==='prod'?b.rate*RES[b.res].v:b.type==='house'?b.pop*.4:.5*Math.pow(5,b.era);
  const sc=val/gain;if(sc<bs){bs=sc;best=b;}
 });
 return best;
}

function idleWorkers(){return Math.floor(G.s.pop)-totalWorkers();}
function setWorkers(res,n){
 const s=G.s;if(RES[res].era>s.era)return;
 const cur=s.work[res]||0;
 let tgt=Math.max(0,cur+n);
 const free=idleWorkers();
 if(tgt-cur>free)tgt=cur+Math.max(0,free);
 if(tgt!==cur){s.work[res]=tgt;G.dirty=true;}
}
function balanceWorkers(){
 const s=G.s,rs=unlockedRes();
 RES_ORDER.forEach(r=>s.work[r]=0);
 const n=Math.floor(s.pop),k=rs.length,q=Math.floor(n/k),rem=n%k;
 rs.forEach((r,i)=>{s.work[r]=q+(i<rem?1:0);});

 if(now<s.evt.next||G.pendingEvent||G.pendingTale||G.busy||s.era<1)return;

  case 'toll':{const g=Math.min(s.res.gold,Math.max(1,r.gold*30));s.res.gold-=g;m='You pay '+fmt(g)+' gold. They give you a receipt. You are not sure why that helps.';break;}
  case 'fightb':{if(defensePower()>=RAID_BASE[Math.min(7,s.era)]*.2){m='Bandits flee. Loot: '+add('gold',120);addXp(xpReward(.03));}else{m='The bandits win this round and take your lunch.';}break;}
  case 'omen':{const c=Math.min(s.res.mana,Math.max(10,r.mana*60));s.res.mana-=c;addXp(xpReward(.08));m='The Hollowroot hums, pleased. XP gained.';break;}
 }

// ---- story and achievements ----
function condVal(c){
 const s=G.s;
 switch(c.k){
  case 'tap':return s.st.taps;
  case 'bld':return bCount(c.id);
  case 'bldn':return totalBuildings();
  case 'era':return s.era;
  case 'lvl':return s.hero.lvl;
  case 'tot':return s.life[c.rn||c.res];
  case 'reg':return Object.keys(s.regions).length;
  case 'raid':return s.st.raids;
  case 'army':return totalUnits();
  case 'pop':return Math.floor(s.pop);
  case 'tech':return Object.keys(s.techs).length;
  case 'comp':return Object.keys(s.comp).length;
  case 'wonder':return Object.keys(s.wonders).length;
  case 'exp':return s.st.exps;
  case 'prest':return s.pres.count;
  case 'spell':return s.st.spells;
  case 'chap':return s.chap;
  case 'pow':return armyPower();
  case 'cre':return crCount();
  case 'bond':return crMaxBond();
  case 'evo':return crEvoCount();
  case 'tale':return talesDone();
  case 'asc':return s.asc.count;
  case 'bount':return s.bounty.done;
  case 'feed':return s.st.feeds;
  case 'relic':return s.st.relics;
 }
 return 0;
}
function chapterGoal(c){return c.n!==undefined?c.n:c.v;}
function checkStory(){
 const s=G.s;
 while(s.chap<CHAPTERS.length){
  const ch=CHAPTERS[s.chap];
  if(condVal(ch.c)<chapterGoal(ch.c))break;
  s.chap++;
  say('<b>Chapter '+s.chap+': '+ch.n+'</b><br>'+ch.txt,'story');
  addXp(xpReward(.05));
  const secs=40*Math.min(s.chap,40);
  RES_ORDER.forEach(r=>{if(RES[r].era<=s.era&&r!=='crystal')addRes(r,Math.max(10,G.rates[r]*secs*.25));});
  toast('📖 Chapter '+s.chap+': '+ch.n);emit('struct');
 }
 let got=false;
 ACH.forEach(a=>{
  if(s.ach[a.id])return;
  if(condVal({k:a.k,rn:a.rn})>=a.v){s.ach[a.id]=true;got=true;sys('🏆 Achievement: <b>'+a.n+'</b> (+1% all production)');toast('🏆 '+a.n);}
 });
 if(got){G.dirty=true;emit('struct');}
}
// ---- prestige ----
function heartGain(){
 const s=G.s;if(s.era<3)return 0;
 const sc=runScore();
 return Math.floor(Math.pow(sc/1e12,.25)*G.S.gain);
}
function canRebirth(){return heartGain()>=1;}
function startStash(){
 const l=shopLvl('stash');if(!l)return 0;return 400*Math.pow(5,l-1);
}
function rebirth(){
 if(!canRebirth())return false;
 const old=G.s,gain=heartGain();
 const n=newState();
 n.name=old.name;n.hero=old.hero;n.comp=old.comp;n.relics=old.relics;n.ach=old.ach;n.life=old.life;n.st=old.st;n.set=old.set;n.seen=old.seen;
 n.pres={heart:old.pres.heart+gain,total:old.pres.total+gain,count:old.pres.count+1,shop:old.pres.shop};
 n.cr=old.cr;n.tales=old.tales;n.chap=old.chap;n.bounty=old.bounty;n.asc=old.asc;
 n.t=Date.now();
 G.s=n;
 const st=startStash();if(st){addRes('wood',st);addRes('stone',st*.6);addRes('food',st*.8);n.tot={wood:0,stone:0,food:0,iron:0,gold:0,mana:0,crystal:0};}
 n.era=Math.min(3,shopLvl('eraskip')+ascLvl('startera'));
 if(n.era>=1)n.raid.next=Date.now()+150000;
 n.pop=2;
 G.dirty=true;recalc();

function shopCost(sh){return Math.ceil(sh.base*Math.pow(sh.g,shopLvl(sh.id)));}
function buyShop(id){
 const sh=SHMAP[id],s=G.s,l=shopLvl(id);
 if(l>=sh.max)return false;const c=shopCost(sh);if(s.pres.heart<c)return false;

// ---- save / load ----
function save(){
 try{G.s.t=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(G.s));return true;}catch(e){return false;}
}
function mergeDeep(dst,src){
 for(const k in src){
  if(src[k]&&typeof src[k]==='object'&&!Array.isArray(src[k])&&dst[k]&&typeof dst[k]==='object'&&!Array.isArray(dst[k]))mergeDeep(dst[k],src[k]);
  else dst[k]=src[k];
 }
 return dst;
}
function loadState(json){
 const d=JSON.parse(json);const s=mergeDeep(newState(),d);
 // drop unknown ids
 for(const id in s.techs)if(!TMAP[id])delete s.techs[id];
 s.rq=s.rq.filter(q=>TMAP[q.id]);
 return s;
}
function exportSave(){return btoa(unescape(encodeURIComponent(JSON.stringify(G.s))));}
function importSave(txt){
 const json=decodeURIComponent(escape(atob(txt.trim())));
 G.s=loadState(json);G.dirty=true;recalc();save();emit('struct');
}
function hardReset(){G.s=newState();G.log=[];G.dirty=true;G.pendingEvent=null;recalc();save();emit('struct');}
function offlineCapSec(){return G.S.offCap*3600;}
function applyOffline(sec){
 if(sec<20)return null;
 const s=G.s;recalc();
 const eff=Math.min(1,G.S.offEff),use=Math.min(sec,offlineCapSec())*eff;
 const gain={};
 RES_ORDER.forEach(r=>{if(RES[r].era<=s.era){const a=G.rates[r]*use;gain[r]=a;addRes(r,a);}});
 const xp=0;
 s.raid.act=null;s.raid.next=Math.max(s.raid.next,Date.now()+60000);
 let enc=0;for(let i=0;i<Math.min(3,Math.floor(use/1500));i++)if(spawnEncounter())enc++;
 return {sec,use,gain,xp,enc};
}
// ---- main tick ----
let _lastSave=0,_lastStory=0,_autoTap=0;
function tick(dt){
 const s=G.s,now=Date.now();
 if(G.dirty)recalc();
 // buffs expiring
 for(const k in s.buffs)if(s.buffs[k]<=now){delete s.buffs[k];G.dirty=true;}
 // production
 RES_ORDER.forEach(r=>{if(RES[r].era<=s.era){const a=G.rates[r]*dt;if(a>0)addRes(r,a);}});
 // population
 const cap=popCap();
 if(s.pop<cap){s.pop=Math.min(cap,s.pop+Math.max(.5,s.pop*.03)*G.S.popGrow*dt);}
 else if(s.pop>cap)s.pop=cap;
 if(totalWorkers()>Math.floor(s.pop)){
  clearWorkers();
 }
 // research
 for(let i=s.rq.length-1;i>=0;i--){if(s.rq[i].end<=now){const q=s.rq.splice(i,1)[0];finishTech(q);}}
 // expeditions
 for(let i=s.exp.length-1;i>=0;i--){if(s.exp[i].end<=now){const x=s.exp.splice(i,1)[0];finishExp(x);}}
 // raids
 if(s.era>=1){
  if(s.raid.act){if(now>=s.raid.act.ends)resolveRaid();}
  else if(s.raid.next&&now>=s.raid.next)spawnRaid();
  else if(!s.raid.next)s.raid.next=now+150000;
 }
 // automation
 const at=shopLvl('auto');
 if(at){_autoTap+=dt*at;while(_autoTap>=1){_autoTap-=1;let v=tapValue();addRes(s.focus,v);}}
 const ab=shopLvl('builder');
 if(ab){s.auto.b+=dt;const iv=Math.max(1,12/ab);if(s.auto.b>=iv){s.auto.b=0;const b=bestBuy();if(b)buyBuilding(b.id,1);}}
 // slow checks
 if(now-_lastStory>1000){_lastStory=now;checkCompanions();checkStory();maybeEvent(now);slowChecks(now);}
 if(now-_lastSave>15000){_lastSave=now;save();}
}
function initGame(){
 let loaded=false;
 try{const raw=localStorage.getItem(SAVE_KEY);if(raw){G.s=loadState(raw);loaded=true;}}catch(e){loaded=false;}
 if(!loaded){
  G.s=newState();
  sys('Welcome, Warden-Heir. You stand in the ashes of the Hollowroot. Tap to gather. Tap more. Do not look at the dragon yet.');
 }
 G.dirty=true;recalc();
 let off=null;
 if(loaded){off=applyOffline((Date.now()-G.s.t)/1000);}
 G.s.t=Date.now();
 if(G.s.pop<2)G.s.pop=2;
 checkCompanions();
 return off;
}

// ---- creatures ----
function crCount(){return Object.keys(G.s.cr.own).length;}
function crMaxBond(){let m=0;for(const k in G.s.cr.own)m=Math.max(m,G.s.cr.own[k].lvl);return m;}
function crEvoCount(){let n=0;for(const k in G.s.cr.own)if(G.s.cr.own[k].evo)n++;return n;}
function crName(c){const st=G.s.cr.own[c.id];return st&&st.evo?c.evo:c.n;}
function crSlotsNow(){return G.S.crSlots;}
function crRateCost(c,secs){return Math.max(0,(G.rates[c.fav]||0)*secs);}
function crBondCost(c){
 const st=G.s.cr.own[c.id];
 return [[c.fav,Math.max(c.bc*2*Math.pow(1.5,st.lvl-1),crRateCost(c,40*Math.pow(1.27,st.lvl-1)))/G.S.bond]];
}
function crEvoCost(c){return [[c.fav,Math.max(c.bc*Math.pow(1.5,30)*.8,crRateCost(c,14000))/G.S.bond],['gold',Math.max(c.bc*Math.pow(1.5,30)*.1,(G.rates.gold||0)*1800)/G.S.bond]];}
function crBefriendCost(c){return [[c.fav,Math.max(c.bc*2.5,crRateCost(c,500))/G.S.bond]];}
function crTotalMult(c){const st=G.s.cr.own[c.id];return (st.evo?1.5:1)*G.S.crMul;}
function wildPool(){
 const s=G.s;
 return CRS.filter(c=>c.g.k==='wild'&&c.era<=s.era&&!s.cr.own[c.id]&&!s.cr.enc.some(e=>e.id===c.id));
}
function rollWild(){
 const pool=wildPool();if(!pool.length)return null;
 const luck=G.S.crLuck;
 const w=pool.map(c=>RAR[c.rar].w*(c.rar>=2?1+luck*3:1));
 let tot=0;w.forEach(x=>tot+=x);let r=Math.random()*tot;
 for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i].id;}
 return pool[pool.length-1].id;
}
function spawnEncounter(){
 const s=G.s;if(s.cr.enc.length>=4)return false;
 const id=rollWild();if(!id)return false;
 s.cr.enc.push({id,t:Date.now()});
 const c=CRMAP[id];
 say(c.i+' A wild <b>'+c.n+'</b> ('+RAR[c.rar].n+') lingers near your realm. Check the Menagerie.','story');toast(c.i+' '+c.n+' appeared!');
 emit('struct');return true;
}
function autoActivate(id){

 if(a.indexOf(id)<0&&a.length<G.S.crSlots)a.push(id);
}
function grantCreature(id){
 const s=G.s,c=CRMAP[id];if(!c||s.cr.own[id])return false;
 s.cr.own[id]={lvl:1,evo:false};
 s.cr.enc=s.cr.enc.filter(e=>e.id!==id);
 autoActivate(id);G.dirty=true;
 say(c.i+' <b>'+c.n+'</b> joins your realm. '+c.lore[0],'story');toast(c.i+' '+c.n+' joined!');

function befriend(id){

  else RES_ORDER.forEach(r=>{if(RES[r].era<=s.era)addRes(r,G.rates[r]*sk.gain);});
 }
 s.st.spells++;G.dirty=true;sys(c.i+' <b>'+c.n+'</b> uses <b>'+sk.n+'</b>!');emit('struct');return true;

function autoCastCreatures(){
 if(!ascLvl('whisper'))return;
